[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Speed: let browsers keep pictures instead of re-checking them on every visit.
# /media files have a fingerprint in their name, so they never change: keep them for a year.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Meme Booth pictures keep their names, so keep them for a week (refreshed quietly in the background after a day).
[[headers]]
  for = "/booth/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/booth/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/fathood-logo.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# short link for the game: fathood.org/play
[[redirects]]
  from = "/play"
  to = "/beta-78c91828/"
  status = 301

# the Fat List admin now lives inside the one admin page
[[redirects]]
  from = "/fatlist-admin.html"
  to = "/admin.html"
  status = 301
