[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# short link for the game: fathood.org/play
[[redirects]]
  from = "/play"
  to = "/beta-78c91828/"
  status = 301

# the Fat List admin now lives inside the one admin page
[[redirects]]
  from = "/fatlist-admin.html"
  to = "/admin.html"
  status = 301
